[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-from-scratch-portfolio"
version = "0.1.0"
description = "An educational PyTorch Vision Transformer with correctness references"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<2.7", "torchvision>=0.21,<0.22", "numpy>=1.26,<3", "PyYAML>=6,<7", "matplotlib>=3.9,<4", "tensorboard>=2.19,<3", "fvcore==0.1.5.post20221221"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.2", "timm==1.0.15", "ipykernel==6.29.5"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: single-batch learning and exact resume checks"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
